<style id="app-css">
/* v2 site : onglets Joueurs + Notre jeu ; sur téléphone, Skills / Lancements / Docs passent dans « Plus ». */
.tabbar .more{display:flex}
.tabbar .mx{display:none}
@media (min-width:900px){.tabbar .more{display:none}.tabbar .mx{display:flex}}
.morelist{display:grid;gap:8px}
.morelist button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--line);background:var(--panel-2);border-radius:10px;padding:14px;font:600 16px var(--f-body);color:var(--fg)}
.morelist svg{width:22px;height:22px;stroke:var(--acc-text);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.gm-hero{background:var(--club);color:var(--club-ink);border-radius:var(--r);padding:22px 18px;margin-bottom:12px;position:relative;overflow:hidden}
.gm-hero .eyebrow{color:var(--tint)}
.gm-hero h2{font:800 clamp(34px,7vw,58px)/.95 var(--f-display);text-transform:uppercase;letter-spacing:.01em;margin:6px 0 10px;text-wrap:balance}
.gm-hero p.id{max-width:62ch;margin:0 0 16px;opacity:.92}
.gm-sig{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.gm-sig div{background:rgba(255,255,255,.1);border:1px solid var(--club-line);border-radius:10px;padding:12px}
.gm-sig b{display:block;font:700 21px/1.05 var(--f-display);text-transform:uppercase}
.gm-sig span{font-size:13.5px;opacity:.9}
.gm-jump{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.gm-sec{margin-bottom:18px;scroll-margin-top:72px}
.gm-sec>.sec-h h2{font-size:24px}
.gm-sec>.lead{color:var(--muted);margin:-6px 0 10px;max-width:70ch}
.gm-cycle{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;font:700 14px var(--f-display);text-transform:uppercase;letter-spacing:.03em;color:var(--acc-text);margin:0 0 10px}
.gm-cycle i{font-style:normal;color:var(--muted)}
.gm-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:10px}
.gm-card{padding:16px;display:flex;flex-direction:column;gap:8px}
.gm-card h3{font:800 24px/1 var(--f-display);text-transform:uppercase;margin:0}
.gm-card .int{color:var(--muted);margin:0}
.gm-card .me{margin:0;padding:8px 10px;border-left:4px solid var(--club);background:var(--panel-2);border-radius:0 8px 8px 0;font-weight:600}
.gm-card .subs{font-size:13.5px;color:var(--muted);margin:0}
.gm-words{display:flex;flex-wrap:wrap;gap:5px}
.gm-words span{font:700 12px var(--f-mono);text-transform:uppercase;letter-spacing:.04em;background:var(--club);color:var(--club-ink);border-radius:5px;padding:4px 7px}
.gm-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:8px}
.gm-list.l4{grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))}
.gm-list div{padding:12px 14px}
.gm-list b{display:block;font:700 18px/1.1 var(--f-display);text-transform:uppercase}
.gm-list span{color:var(--muted);font-size:14px}
.gm-strat{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:10px}
.gm-strat .card{padding:16px}
.gm-strat small{font:600 11px var(--f-body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.gm-strat b{display:block;font:800 30px/1 var(--f-display);text-transform:uppercase;color:var(--acc-text);margin:4px 0 6px}
.gm-strat p{margin:0;font-size:14px}
.gm-zones{border-radius:var(--r);overflow:hidden;border:1px solid var(--line)}
.gm-zh,.gm-z{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.1fr) minmax(0,1.1fr)}
.gm-zh{background:var(--panel-2);font:600 11px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.gm-zh span,.gm-z span{padding:10px 12px;min-width:0}
.gm-z{background:var(--pitch);color:#fff;border-top:1px solid var(--pitch-line)}
.gm-z:nth-child(odd){background:var(--pitch-2)}
.gm-z .zl{font:600 12px var(--f-mono);opacity:.85}
.gm-z b{display:block;font:700 17px/1.1 var(--f-display);text-transform:uppercase}
.gm-z small{font-size:12.5px;opacity:.9}
.gm-lanes{display:grid;grid-template-columns:1.4fr repeat(5,1fr) 1.4fr;gap:3px;margin:12px 0 8px}
.gm-lanes span{background:var(--pitch);color:#fff;text-align:center;padding:10px 2px;border-radius:5px;font:700 13px var(--f-mono);min-width:0;overflow:hidden;text-overflow:ellipsis}
.gm-lanes span:first-child,.gm-lanes span:last-child{background:var(--club)}
@media (max-width:520px){.gm-zh{display:none}.gm-z{grid-template-columns:1fr}.gm-z span{padding:6px 12px}.gm-z .zl{padding-top:10px}.gm-lanes span{font-size:10.5px}}
.homegm .gm-sig{grid-template-columns:1fr}
.homegm .gm-sig div{background:var(--panel-2);border-color:var(--line)}
.homegm .gm-sig b{font-size:18px;color:var(--acc-text)}
.homegm .slo{font:800 24px/1 var(--f-display);text-transform:uppercase;margin:2px 0 10px}
/* Layout : app de vestiaire sur téléphone. Couleurs du club : vert et blanc. Bandeau vert, cartes empilées, barre d'onglets en bas (en haut sur ordi, deux colonnes).
   --acc = accent posé sur le vert (blanc), --acc-text = vert lisible sur fond clair, --tint = vert pâle pour les petites étiquettes sur le vert.
   Quand le coach règle la couleur du club, applyTheme() fournit --club, --club-2, --club-text, --club-text-dk et --club-tint. */
:root{
  --bg:#eef2ed; --panel:#ffffff; --panel-2:#f3f6f2; --line:#d4ddd3; --fg:#13201a; --muted:#56675b;
  --club:#0e5c30; --club-2:#127038; --club-ink:#ffffff; --club-line:rgba(255,255,255,.26);
  --acc:#ffffff; --acc-ink:var(--club); --acc-text:var(--club-text,#127a3e); --tint:var(--club-tint,#bfe8cc);
  --primary:var(--club); --primary-ink:#ffffff;
  --c5:#7a4fc9; --c6:#c0641a;
  --gold:#8a640b; --red:#c23a28; --blue:#1e6f9c;
  --pitch:#2f6b42; --pitch-2:#2b633d; --pitch-line:rgba(255,255,255,.8);
  --att:#ffffff; --att-ink:var(--club); --att-ring:var(--club);
  --opp:#e04a36; --opp-ink:#ffffff; --opp-ring:rgba(255,255,255,.9);
  --ball:#f6f1e3; --ball-ring:#6b4a26; --cone:#ff8f2e; --block:rgba(255,255,255,.14);
  --ink-pass:#ffffff; --ink-run:#ffd84a; --ink-kick:#86dcff;
  --shadow:0 1px 2px rgba(15,40,25,.06),0 6px 18px rgba(15,40,25,.06);
  --scrim:rgba(6,16,10,.55);
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b1510; --panel:#122019; --panel-2:#172a1f; --line:#25392c; --fg:#e3ece4; --muted:#8fa294;
  --club:#0b4626; --club-2:#0f532e; --club-ink:#ffffff; --club-line:rgba(255,255,255,.2);
  --acc:#ffffff; --acc-ink:var(--club); --acc-text:var(--club-text-dk,#6fd796);
  --primary:#ffffff; --primary-ink:var(--club);
  --c5:#b49cff; --c6:#ffa45c;
  --gold:#e3b44c; --red:#ff7461; --blue:#7fcff7;
  --pitch:#22533a; --pitch-2:#1f4c35; --pitch-line:rgba(255,255,255,.72);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  --scrim:rgba(0,0,0,.6);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1510; --panel:#122019; --panel-2:#172a1f; --line:#25392c; --fg:#e3ece4; --muted:#8fa294;
  --club:#0b4626; --club-2:#0f532e; --club-ink:#ffffff; --club-line:rgba(255,255,255,.2);
  --acc:#ffffff; --acc-ink:var(--club); --acc-text:var(--club-text-dk,#6fd796);
  --primary:#ffffff; --primary-ink:var(--club);
  --c5:#b49cff; --c6:#ffa45c;
  --gold:#e3b44c; --red:#ff7461; --blue:#7fcff7;
  --pitch:#22533a; --pitch-2:#1f4c35; --pitch-line:rgba(255,255,255,.72);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  --scrim:rgba(0,0,0,.6);
  color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--f-body);padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button[disabled]{opacity:.4;cursor:default}
a{color:inherit}
:focus-visible{outline:2px solid var(--acc-text);outline-offset:2px}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;letter-spacing:.01em;text-wrap:balance;line-height:1.08}
p{margin:0}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.hint{font-size:12.5px;color:var(--muted)}
.eyebrow{display:block;font:600 11px/1.2 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.sp{flex:1}

/* Header */
.hdr{background-color:var(--club);background-image:linear-gradient(color-mix(in srgb,var(--club) 82%,transparent),color-mix(in srgb,var(--club) 92%,transparent)),var(--hdr-img,none);background-size:cover;background-position:center 58%;color:var(--club-ink)}
.hdr .wrap{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-block:14px}
.brand{display:flex;align-items:center;gap:11px;margin-right:auto;min-width:0}
.crest{flex:none;width:40px;height:46px;display:grid;place-items:center;padding-bottom:6px;background:var(--acc);color:var(--acc-ink);font:800 15px/1 var(--f-display);letter-spacing:.05em;clip-path:polygon(0 0,100% 0,100% 68%,50% 100%,0 68%)}
.brand h1{font-size:27px;font-weight:800;text-transform:uppercase;line-height:.95;color:var(--tint)}
.brand h1 b{color:var(--acc);font-weight:800}
.slogan{margin-top:4px;font:600 10.5px/1 var(--f-body);letter-spacing:.16em;text-transform:uppercase;opacity:.78;white-space:nowrap}
.hbtn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--club-line);background:transparent;color:var(--club-ink);border-radius:999px;padding:7px 13px;font-weight:600;font-size:13.5px;max-width:100%;min-height:36px}
.hbtn .pdot{width:8px;height:8px;border-radius:50%;background:var(--acc);flex:none}
.hbtn.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}

/* Tabs */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabbar .in{display:grid;grid-template-columns:repeat(6,1fr);max-width:640px;margin:0 auto}
.tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px 8px;color:var(--muted);font:600 11.5px/1 var(--f-body);min-height:56px}
.tabbar svg{width:23px;height:23px}
.tabbar button[aria-current="page"]{color:var(--fg)}
.tabbar button[aria-current="page"] svg{stroke:var(--acc-text)}
.ico{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
@media (min-width:900px){
  body{padding-bottom:48px}
  .tabbar{position:sticky;top:env(safe-area-inset-top,0px);bottom:auto;border-top:0;border-bottom:1px solid var(--line);padding:0}
  .tabbar .in{display:flex;gap:2px;max-width:1120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .tabbar button{flex-direction:row;gap:8px;font-size:14.5px;padding:13px 14px 11px;border-bottom:3px solid transparent;min-height:0}
  .tabbar svg{width:20px;height:20px}
  .tabbar button[aria-current="page"]{border-bottom-color:var(--acc-text)}
}

main{padding-block:16px 24px}
.sec-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 0 12px}
.sec-h h2{font-size:28px;font-weight:800;text-transform:uppercase;margin-right:auto}
.lead{color:var(--muted);margin:-6px 0 14px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}

/* Cards and generic controls */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);min-width:0}
.pad{padding:16px}
.card h3{font-size:21px;font-weight:700;text-transform:uppercase}
.card-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.card-h h3{margin-right:auto}
.sub{font:700 13px/1.2 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:8px 13px;font-weight:600;font-size:14px;min-height:38px;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.danger{color:var(--red)}
.btn.sm{min-height:32px;padding:5px 10px;font-size:13px}
.lbtn{border:1px solid var(--line);background:var(--panel-2);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;min-height:32px}
.ibtn{border:0;background:none;color:var(--muted);width:34px;height:34px;display:grid;place-items:center;border-radius:8px;flex:none}
.ibtn:hover{background:var(--panel-2);color:var(--fg)}
.ibtn svg{width:17px;height:17px}
.actrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel-2);border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:600;white-space:nowrap;line-height:1.6}
.chip i{width:8px;height:8px;border-radius:50%;flex:none}
.chip.ex{border-style:dashed;border-color:var(--gold);color:var(--gold);background:transparent}
.chip.role{border-color:var(--acc-text);color:var(--acc-text);background:transparent}
.chip.pin{color:var(--fg)}
.num{display:inline-grid;place-items:center;min-width:30px;height:30px;padding:0 4px;border-radius:50%;background:var(--att);color:var(--att-ink);border:2px solid var(--att-ring);font:700 13px/1 var(--f-mono);flex:none}
.num.sm{min-width:24px;height:24px;font-size:11.5px}
.hl{color:var(--acc-text);font-weight:700}
.banner{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;border:1px dashed var(--gold);border-radius:var(--r);padding:10px 14px;margin-bottom:14px;background:var(--panel)}
.banner p{flex:1 1 260px;font-size:13.5px}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:26px 18px;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:10px}

/* Home */
.home{display:grid;gap:14px}
.home .col{display:flex;flex-direction:column;gap:14px;min-width:0}
@media (min-width:900px){.home{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);align-items:start}}
.hero{position:relative;overflow:hidden;background:var(--club-2);color:var(--club-ink);border-radius:16px;padding:16px 16px 18px}
.hero::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 44px,rgba(255,255,255,.035) 44px 88px);pointer-events:none}
.hero>*{position:relative}
.hero-photo{margin:-16px -16px 6px;aspect-ratio:5/2;max-width:none;background-color:var(--club);background-size:cover;background-position:43% 72%}
@media (min-width:900px){.hero-photo{aspect-ratio:3/1}}
.hero.has-photo>.wm{top:auto;bottom:-6%;transform:none;height:50%;opacity:.1}
.logoprev:not(.photoprev){background:var(--club)}
.photoprev img{max-height:140px;border-radius:8px}
.hero>.wm{position:absolute;right:-4%;top:50%;transform:translateY(-50%);height:132%;max-height:250px;width:auto;max-width:62%;object-fit:contain;opacity:.16;pointer-events:none}
.hero-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.hero .eyebrow{color:var(--club-ink);opacity:.8}
.cd{font:700 13px/1 var(--f-mono);background:var(--acc);color:var(--acc-ink);border-radius:6px;padding:5px 8px}
.hero .chip.ex{color:var(--acc);border-color:var(--acc)}
.vs{font-size:clamp(30px,8.5vw,44px);font-weight:800;text-transform:uppercase;margin:10px 0 2px;line-height:.95;overflow-wrap:anywhere}
.vs span{color:var(--tint);font-weight:600;font-size:.62em;vertical-align:.18em;margin:0 .1em}
.facts{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:10px;font-size:14px}
.facts span{opacity:.9}
.facts .score{font-family:var(--f-mono);font-weight:700;opacity:1}
.hero-act{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.hero .lbtn{background:transparent;color:var(--club-ink);border-color:var(--club-line)}
.me-card.on{border-color:var(--acc-text)}
.me-head{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.bignum{display:grid;place-items:center;width:54px;height:54px;border-radius:50%;background:var(--att);color:var(--att-ink);border:2.5px solid var(--att-ring);font:700 22px/1 var(--f-mono);flex:none}
.me-card p.muted{margin:6px 0 12px}
.missions{margin:6px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.missions li{position:relative;padding-left:18px}
.missions li::before{content:"";position:absolute;left:2px;top:.55em;width:8px;height:8px;border-radius:2px;background:var(--acc-text)}
.me-card .chips{margin-top:12px}
.golink{display:inline-block;margin-top:12px;border:0;background:none;padding:0;color:var(--acc-text);font-weight:700}
.theme{font-size:clamp(24px,6vw,30px)!important;text-transform:none!important;font-weight:700;margin-top:4px}
.keys{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.keys li{display:flex;gap:10px;align-items:flex-start;background:var(--panel-2);border-radius:9px;padding:9px 12px;font-weight:500}
.keys li::before{content:"";flex:none;width:4px;align-self:stretch;border-radius:2px;background:var(--acc-text)}
.todos{list-style:none;margin:0 0 8px;padding:0;display:flex;flex-direction:column}
.todo{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.todo:first-child{border-top:0}
.todo input{width:22px;height:22px;margin:1px 0 0;accent-color:var(--club);flex:none}
.todo label{flex:1;display:flex;flex-direction:column;cursor:pointer;min-width:0}
.todo .meta{font-size:12.5px;color:var(--muted)}
.todo.done .tt{text-decoration:line-through;color:var(--muted)}
.irow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:none;padding:10px 0;min-height:52px}
.irow:first-child{border-top:0}
.irow .it{flex:1;min-width:0;display:flex;flex-direction:column}
.irow .it b{font-weight:600;overflow-wrap:anywhere}
.irow .it small{color:var(--muted);font-size:12.5px}

/* Compo */
.compo-grid{display:grid;gap:14px}

.compo-grid>div{display:flex;flex-direction:column;gap:14px;min-width:0}
.formation{position:relative;aspect-ratio:1/1;max-width:100%;border-radius:16px;overflow:hidden;background:repeating-linear-gradient(180deg,var(--pitch) 0 12.5%,var(--pitch-2) 12.5% 25%)}
.formation::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent calc(7% - 1px),var(--pitch-line) 7%,transparent calc(7% + 1px)),linear-gradient(90deg,transparent calc(93% - 1px),var(--pitch-line) 93%,transparent calc(93% + 1px));opacity:.5}
.ruck{position:absolute;left:11%;top:3%;font:600 11px var(--f-body);color:var(--pitch-line);border:1px dashed var(--pitch-line);border-radius:6px;padding:2px 8px}
.pill{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;padding:2px;width:84px;color:#fff}
.pill .num{width:38px;height:38px;font-size:15px;box-shadow:0 2px 6px rgba(0,0,0,.28);border:2px solid var(--att-ring)}
.pill .nm{font:600 12px/1.15 var(--f-body);text-align:center;background:rgba(5,20,10,.62);color:#fff;border-radius:6px;padding:2px 6px;max-width:100%;overflow-wrap:anywhere}
.pill.me .num{outline:3px solid var(--ink-run);outline-offset:1px}
.pill.empty .num{background:transparent;color:#fff;border:2px dashed var(--pitch-line);box-shadow:none}
.bench{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.bench-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.bench .pill{position:static;transform:none;flex-direction:row;width:auto;gap:8px;background:var(--panel-2);border-radius:999px;padding:4px 12px 4px 4px;color:var(--fg)}
.bench .pill .num{width:30px;height:30px;font-size:12.5px;box-shadow:none}
.bench .pill .nm{background:none;color:var(--fg);padding:0;font-size:13.5px}
.bench .pill.empty .num{border-color:var(--line);color:var(--muted)}
.roles{margin:0;display:flex;flex-direction:column}
.roles div{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.roles div:first-child{border-top:0}
.roles dt{font-weight:600}
.roles dd{margin:0;color:var(--muted)}
details.mis{border-top:1px solid var(--line)}
details.mis:first-of-type{border-top:0}
details.mis summary{list-style:none;display:flex;align-items:center;gap:10px;padding:9px 0;cursor:pointer;font-weight:600}
details.mis summary::-webkit-details-marker{display:none}
details.mis summary::after{content:"+";margin-left:auto;color:var(--muted);font:600 18px/1 var(--f-mono)}
details.mis[open] summary::after{content:"–"}
details.mis .missions{padding:0 0 12px 4px}
.sq{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.sq li{display:flex;align-items:center;gap:8px;background:var(--panel-2);border-radius:999px;padding:4px 12px 4px 4px;font-size:14px;min-width:0;overflow-wrap:anywhere}
.sq li.me{outline:2px solid var(--acc-text)}
.mseg{display:flex;gap:4px;padding:4px;border-radius:12px;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);margin:0 0 12px;max-width:600px}
.mseg button{flex:1 1 auto;min-width:0;border:0;background:transparent;border-radius:9px;padding:9px 6px;font:700 clamp(13px,3.7vw,16px)/1 var(--f-display);text-transform:uppercase;letter-spacing:.03em;color:var(--muted);min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.mseg button:hover{color:var(--fg)}
.mseg button[aria-pressed="true"]{background:var(--primary);color:var(--primary-ink)}
.mseg .c{font:700 11px/1 var(--f-mono);background:var(--acc-text);color:var(--panel);border-radius:999px;padding:3px 6px}
.mseg button[aria-pressed="true"] .c{background:var(--primary-ink);color:var(--primary)}
.mseg .medot{width:7px;height:7px;border-radius:50%;background:var(--acc-text);flex:none}
.mseg button[aria-pressed="true"] .medot{background:currentColor}
.mhint{margin:0 0 12px}
.golinks{display:flex;flex-wrap:wrap;gap:0 20px}

/* Lancements */
.lhead{display:flex;flex-wrap:wrap;gap:10px 12px;align-items:center;margin:0 0 14px}
.lhead p{flex:1 1 240px}
.lgrp{display:flex;align-items:baseline;gap:8px;font-size:22px;font-weight:800;text-transform:uppercase;margin:4px 0 10px}
.lgrp .cnt{font:600 12px var(--f-mono);color:var(--muted)}
.lgrid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));margin-bottom:20px;align-items:start}
.lcard{display:flex;flex-direction:column;gap:12px;padding:14px 16px 16px}
.lcard.flash{animation:flash 1.6s ease-out}
.lcard .vid,.fld .vid{border-radius:9px}
.fld .vid{margin-top:4px}
.lc-top{display:flex;align-items:flex-start;gap:12px}
.lc-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.lname-b{all:unset;cursor:pointer;border-bottom:1px dashed var(--muted)}
.lname{font-size:29px;font-weight:800;text-transform:uppercase;line-height:.95;overflow-wrap:anywhere}
.lnum{display:grid;place-items:center;width:42px;height:42px;border-radius:10px;background:var(--club);color:var(--acc);font:800 22px/1 var(--f-display);flex:none}

.lsteps{margin:0;padding:0;list-style:none;counter-reset:st;display:flex;flex-direction:column;gap:7px}
.lsteps li{counter-increment:st;display:flex;gap:10px;align-items:flex-start;font-size:15px;line-height:1.4}
.lsteps li::before{content:counter(st);flex:none;display:grid;place-items:center;width:22px;height:22px;margin-top:-1px;border-radius:50%;background:var(--panel-2);border:1px solid var(--line);font:700 11.5px/1 var(--f-mono);color:var(--muted)}
.lboard{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--line);background:var(--panel-2);border-radius:10px;padding:6px 12px 6px 6px;min-height:64px}
.lboard:hover{border-color:var(--muted)}
.lboard .th{flex:none;width:104px;border-radius:7px;overflow:hidden;background:var(--pitch);line-height:0}
.lboard .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.lboard .tx b{font-weight:600;font-size:14px;overflow-wrap:anywhere}
.lboard .tx small{color:var(--acc-text);font-weight:700;font-size:13px}
.lc-act{display:flex;gap:4px;align-items:center;border-top:1px solid var(--line);padding-top:10px}
.lc-act .ibtn{font:700 17px/1 var(--f-mono)}

.insrow{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-top:1px solid var(--line)}
.insrow:first-of-type{border-top:0}
.insh{display:flex;align-items:center;gap:10px}
.ins-txt{white-space:pre-line;overflow-wrap:anywhere}
textarea.ins{width:100%;min-width:0;background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-size:16px;line-height:1.45;resize:vertical}
.lcard.insel{border-color:var(--acc-text)}
.lcard details.mis summary{padding:4px 0;font-size:14px;color:var(--muted)}
.lcard details.mis .lsteps{padding:4px 0 6px}
.libbar{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
/* Clips */
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin:0 0 14px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.fchip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 13px;font-weight:600;font-size:13.5px;white-space:nowrap;min-height:36px}
.fchip[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.fchip{display:inline-flex;align-items:center;gap:7px}
.fchip i{width:9px;height:9px;border-radius:50%;flex:none}
.fchip.main{font:700 15.5px/1 var(--f-display);text-transform:uppercase;letter-spacing:.03em;padding-inline:15px}
.fchip.sm{min-height:32px;padding:4px 11px;font-size:13px}
.fchip.sm .mono{font-size:11.5px;opacity:.7}
.fsep{flex:none;width:1px;align-self:stretch;margin:6px 2px;background:var(--line)}
.subf{margin-top:-6px}
.fchip.zero{opacity:.55}
.fchip.add{border-style:dashed;color:var(--muted);background:transparent}
.catf{display:flex;flex-direction:column;gap:6px;padding:12px 0;border-top:1px solid var(--line)}
.catf-h{display:grid;grid-template-columns:minmax(0,1fr) 128px;gap:6px}
.catf textarea{resize:vertical}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr))}
.clip{overflow:hidden;display:flex;flex-direction:column}
.clip.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 3px var(--acc-text)}100%{box-shadow:var(--shadow)}}
.vid{display:block;width:100%;aspect-ratio:16/9;max-width:100%;background:#000}
.drvlist{max-height:260px;overflow:auto;margin-top:8px;border:1px solid var(--line);border-radius:9px;background:var(--panel-2)}.drvrow{display:flex;align-items:flex-start;gap:10px;padding:8px 10px;border-top:1px solid var(--line);cursor:pointer}.drvrow:first-child{border-top:0}.drvrow[hidden]{display:none}.drvrow input{width:20px;height:20px;margin-top:2px;flex:none;accent-color:var(--club)}.drvrow span{display:flex;flex-direction:column;min-width:0}.drvrow b{font-weight:600;overflow-wrap:anywhere}.drvrow small{color:var(--muted);font-size:12px}.drvpk summary{list-style:none;cursor:pointer;margin-top:6px}.drvpk summary::-webkit-details-marker{display:none}
.drv{aspect-ratio:16/9;max-width:100%;background:#000;border-radius:9px;overflow:hidden}.drv iframe{display:block;width:100%;height:100%;border:0}.drvopen{display:block;font-size:12.5px;font-weight:600;padding:6px 12px 2px;color:var(--acc-text)}
.vlink{position:relative;display:flex;align-items:flex-end;aspect-ratio:16/9;max-width:100%;text-decoration:none;color:#fff;padding:12px;background:radial-gradient(ellipse at 30% 0%,rgba(255,255,255,.12),transparent 60%),repeating-linear-gradient(90deg,var(--pitch) 0 30px,var(--pitch-2) 30px 60px)}
.vlink .play{position:absolute;left:50%;top:50%;width:62px;height:62px;margin:-31px 0 0 -31px;border-radius:50%;background:rgba(5,20,10,.6);border:2px solid rgba(255,255,255,.85)}
.vlink .play::after{content:"";position:absolute;left:24px;top:18px;border-style:solid;border-width:12px 0 12px 19px;border-color:transparent transparent transparent #fff}
.vlink .src{position:relative;font:600 13px var(--f-body);background:rgba(5,20,10,.62);border-radius:6px;padding:4px 9px}
.vlink.none{align-items:center;justify-content:center}
.vlink.none .src{background:transparent;border:1px dashed rgba(255,255,255,.7)}
.cb{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px}
.cb h3{font-size:21px}
.cb .date{font-size:12.5px;color:var(--muted);margin-left:auto}
.look{background:var(--panel-2);border-radius:9px;padding:9px 12px;font-size:14.5px}
.look .eyebrow{margin-bottom:3px;color:var(--acc-text)}
.at{font-size:14px}
.who{font-size:13px;color:var(--muted)}

/* Boards */
.bcard{display:flex;flex-direction:column;text-align:left;padding:0;overflow:hidden;border:1px solid var(--line)}
.bcard:hover{border-color:var(--muted)}
.bprev{display:block;width:100%;height:auto;pointer-events:none}
.bc-b{display:flex;flex-direction:column;gap:5px;padding:12px 14px 14px}
.bc-b b{font:700 20px/1.1 var(--f-display);text-transform:uppercase}
.bc-b small{color:var(--muted);font-size:12.5px}
.bv{display:flex;flex-direction:column;gap:12px}
.bv-top{display:flex;align-items:flex-start;gap:8px;flex-wrap:wrap}
.bv-title{flex:1 1 220px;min-width:0;display:flex;flex-direction:column;gap:6px}
.bv-title h2{font-size:26px;font-weight:800;text-transform:uppercase}
.bv-stage{border-radius:14px;overflow:hidden;background:var(--pitch);box-shadow:var(--shadow);max-width:100%}
.bv-stage svg{display:block;width:100%;height:auto;max-height:max(280px,calc(100vh - 150px))}
.bv-stage svg.edit{touch-action:none;cursor:crosshair}
.steps{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tbtn{width:40px;height:38px;border:1px solid var(--line);background:var(--panel);border-radius:9px;font:700 20px/1 var(--f-mono);display:grid;place-items:center}
.dots{display:flex;gap:6px}
.dots button{width:12px;height:12px;border-radius:50%;border:2px solid var(--muted);background:transparent;padding:0}
.dots button.on{background:var(--acc-text);border-color:var(--acc-text)}
.stl{font-size:13px;color:var(--muted);min-width:76px}
.cap{font-size:15.5px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.cap b{color:var(--acc-text);margin-right:4px}
#capIn{width:100%;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);padding:10px 12px;font-size:16px;resize:vertical}
.tools{display:flex;flex-direction:column;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px}
.trow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tool{border:1px solid var(--line);background:var(--panel-2);border-radius:8px;padding:4px 9px;font-weight:600;font-size:12.5px;min-height:32px}
.tool[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.tool.t-att::before,.tool.t-def::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px;background:var(--att);border:1px solid var(--att-ring)}
.tool.t-def::before{background:var(--opp);border-color:var(--opp)}
.sw{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);padding:0}
.sw[aria-pressed="true"]{border-color:var(--fg);box-shadow:inset 0 0 0 2px var(--panel)}
.txtin,.tklab input{border:1px solid var(--line);border-radius:8px;background:var(--panel-2);padding:6px 9px;font-size:16px;min-width:0;width:170px}
.tklab{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600}
.tklab input{width:80px}
.tools .hint{margin:0}
.acv{display:block;width:min(100%,calc((100vh - 140px) * 1.2308));height:auto;margin:0 auto;cursor:pointer}
/* Ardoise en mode édition : terrain à gauche, réglages à droite sur ordinateur (empilés sur téléphone) */
.a-wrap{display:flex;flex-direction:column;gap:12px}
.a-main{display:flex;flex-direction:column;gap:12px;min-width:0}
@media (min-width:900px){
  .a-wrap.ed{display:grid;grid-template-columns:minmax(0,1fr) 320px;align-items:start}
  .a-wrap.ed #aSide{position:sticky;top:64px;max-height:calc(100vh - 80px);overflow:auto}
}
.acv.edit{touch-action:none;cursor:crosshair}
canvas.bprev{display:block;width:100%;height:auto}
.actl{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.actl input[type=range]{flex:1 1 140px;min-width:0;accent-color:var(--acc-text)}
.atime{font-size:14px;font-weight:700;min-width:52px;text-align:right}
.alegend{display:inline-flex;gap:12px;font-size:12.5px;color:var(--muted);margin-left:auto}
.alegend span{display:inline-flex;align-items:center;gap:6px}
.alegend .sw{display:inline-block;width:22px;height:0;border:0;border-top:3px solid var(--fg);border-radius:0;padding:0}
.alegend .sw.dash{border-top-style:dashed;border-top-color:var(--gold)}
.seg{display:inline-flex}
.seg .tool{border-radius:0;margin-left:-1px}
.seg .tool:first-child{border-radius:8px 0 0 8px;margin-left:0}
.seg .tool:last-child{border-radius:0 8px 8px 0}
.apanel{display:flex;flex-direction:column;gap:8px}
.apanel .sub{margin:10px 0 0}
.asel{display:flex;align-items:center;gap:10px}
.achip{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font:800 18px/1 var(--f-display);background:var(--att);color:var(--att-ink);border:3px solid var(--att-ring);flex:none}
.achip.def{background:var(--opp);color:#fff;border-color:#f4f1e8}
.achip.fwd{background:var(--att-ring);color:#ffffff;border-color:#ffffff}
.afield{display:grid;grid-template-columns:70px minmax(0,1fr) 64px;gap:8px;align-items:center;font-size:14px;font-weight:600}
.afield input{accent-color:var(--acc-text);min-width:0}
.afield output{text-align:right;font-family:var(--f-mono);font-size:13px}
.apasses{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.apasses li{display:flex;align-items:center;gap:10px;font-size:14px}
.apasses .who{font:700 18px/1 var(--f-display);margin-right:auto}
.apasses input{width:70px;border:1px solid var(--line);border-radius:8px;background:var(--panel-2);padding:6px 8px;font-size:16px}
.apaste{display:flex;flex-direction:column;gap:6px}
.apaste textarea{width:100%;border:1px solid var(--line);border-radius:8px;background:var(--panel-2);padding:8px;font:12px/1.4 var(--f-mono)}
form[data-bkind="anim"] .k-steps,form[data-bkind="steps"] .k-anim{display:none}

/* Pitch drawing */
.p-grass{fill:var(--pitch)}
.p-stripe{fill:var(--pitch-2)}
.p-ln{stroke:var(--pitch-line);stroke-width:.22;fill:none}
.p-dash{stroke-dasharray:.9 .9;opacity:.75}
.p-ingoal{fill:rgba(255,255,255,.06)}
.p-txt{fill:var(--pitch-line);font:600 1.4px var(--f-mono);opacity:.75}
.tk text{font:700 1.75px var(--f-mono);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.tk circle{stroke-width:.28}
.tk.att circle{fill:var(--att);stroke:var(--att-ring)}
.tk.att text{fill:var(--att-ink)}
.tk.def circle{fill:var(--opp);stroke:var(--opp-ring);stroke-width:.2}
.tk.def text{fill:var(--opp-ink)}
.tk.ball ellipse{fill:var(--ball);stroke:var(--ball-ring);stroke-width:.2}
.tk.ball line{stroke:var(--ball-ring);stroke-width:.14}
.tk.cone path{fill:var(--cone)}
.tk.block rect{fill:var(--block);stroke:var(--pitch-line);stroke-width:.18;stroke-dasharray:.6 .4}
.tk.block text{fill:var(--pitch-line);font:600 1.3px var(--f-body)}
.tk.sel circle,.tk.sel rect,.tk.sel ellipse{stroke:var(--ink-run);stroke-width:.5;stroke-dasharray:none}
.tk.gone{animation:tkout 1s forwards}
.tk.new{animation:tkin 1s both}
@keyframes tkout{to{opacity:0}}
@keyframes tkin{from{opacity:0}}
svg.edit .tk{cursor:grab}
.ln .stroke{fill:none;stroke-width:.4;stroke-linecap:round;stroke-linejoin:round}
.ln.k-run .stroke{stroke-dasharray:1.1 .7;stroke-linecap:butt}
.ln.k-kick .stroke{stroke-dasharray:.01 .8;stroke-width:.5}
.ln.k-free .stroke{stroke-width:.5}
.ln .hit{fill:none;stroke:transparent;stroke-width:2.4}
svg:not(.edit) .ln .hit{pointer-events:none}
.ln text.lbl{font:700 1.9px var(--f-body);paint-order:stroke;stroke:rgba(0,0,0,.55);stroke-width:.45px;text-anchor:middle}
#lyrL{transition:opacity .35s}
#lyrL.fade{opacity:.12}
@media (prefers-reduced-motion:reduce){#lyrL{transition:none}.clip.flash,.tk.gone,.tk.new{animation:none}}

/* Docs */
.folder{margin-bottom:12px}
.folder summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:13px 16px}
.folder summary::-webkit-details-marker{display:none}
.folder summary h3{font-size:20px;margin-right:auto}
.folder summary .cnt{font:600 12px var(--f-mono);color:var(--muted)}
.folder summary::after{content:"+";font:600 18px/1 var(--f-mono);color:var(--muted)}
.folder[open] summary::after{content:"–"}
.folder .items{padding:0 16px 8px}
.prose{display:flex;flex-direction:column;gap:9px;font-size:15.5px;max-width:68ch}
.prose h4{font-size:19px;text-transform:uppercase;margin-top:8px}
.prose ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.prose a{color:var(--acc-text);overflow-wrap:anywhere}
.docimg{width:100%;border-radius:10px;border:1px solid var(--line)}

/* Sheets */
dialog.sheet{border:0;padding:0;background:var(--panel);color:var(--fg);width:min(640px,100vw);max-width:100vw;max-height:92vh;margin:auto auto 0;border-radius:18px 18px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.25)}
dialog.sheet::backdrop{background:var(--scrim)}
@media (min-width:700px){dialog.sheet{margin:auto;border-radius:16px;max-height:88vh}}
.sheet form,.sheet .sh{display:flex;flex-direction:column;max-height:inherit}
.sh-h{display:flex;align-items:center;gap:8px;padding:14px 16px 12px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:2}
.sh-h h2{font-size:23px;font-weight:800;text-transform:uppercase;margin-right:auto;min-width:0}
.sh-b{padding:14px 16px 18px;display:flex;flex-direction:column;gap:12px;overflow:auto}
.sh-f{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--panel)}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fl{font-size:12.5px;font-weight:600;color:var(--muted);letter-spacing:.02em}
.fld input,.fld select,.fld textarea,.sheet .in{width:100%;min-width:0;background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-size:16px}
.fld textarea{resize:vertical;line-height:1.45}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chk{display:flex;align-items:center;gap:8px;font-weight:500}
.chk input{width:20px;height:20px;accent-color:var(--club)}
.pchips{display:flex;flex-wrap:wrap;gap:6px}
.pchip{position:relative}
.pchip input{position:absolute;opacity:0;inset:0;cursor:pointer}
.pchip span{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:13.5px;font-weight:600;background:var(--panel-2)}
.pchip input:checked+span{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.pchip input:focus-visible+span{outline:2px solid var(--acc-text);outline-offset:2px}
.slotf{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.slotf:first-child{border-top:0;padding-top:0}
.slotf .num{grid-row:span 2;align-self:start}
.slotf .lab{font-size:12.5px;color:var(--muted);font-weight:600;display:block;margin-bottom:4px}
.rolef{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr);gap:6px}
.sqf{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:6px;align-items:center}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.pickbtn{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel-2);border-radius:999px;padding:5px 12px 5px 5px;font-weight:600;text-align:left;min-height:44px}
.pickbtn.on{border-color:var(--acc-text);outline:2px solid var(--acc-text)}
form[data-kind="note"] .k-link,form[data-kind="note"] .k-img,form[data-kind="link"] .k-img,form[data-kind="image"] .k-link{display:none}
.imgprev{max-height:180px;width:auto;border-radius:8px}
.sheet-name{font:700 22px/1.1 var(--f-display);text-transform:uppercase}

/* Skills : exercices individuels par poste */
.skill .dose{display:flex;flex-direction:column;gap:2px;background:var(--panel-2);border-radius:9px;padding:9px 12px}
.skill .dose .eyebrow{color:var(--acc-text)}
.skill .dose b{font-size:14px;font-weight:700}
.skill.is-done{border-color:var(--acc-text)}
.skill .lsteps{margin-top:2px}
.sfiles{display:flex;flex-direction:column;gap:6px}
.sfile{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--panel-2);border-radius:9px;padding:8px 12px;min-height:44px;text-decoration:none;font-weight:600;font-size:14px;min-width:0}
.sfile:hover{border-color:var(--muted)}
.sfile .ext{flex:none;font:700 11px/1 var(--f-mono);background:var(--red);color:#fff;border-radius:5px;padding:5px 6px;text-transform:uppercase}
.sfile .nm{flex:1;min-width:0;overflow-wrap:anywhere}
.sfile .go{flex:none;color:var(--acc-text)}
.skfrow{display:flex;align-items:center;gap:8px;font-size:14px;padding:4px 0}
.skfrow span{flex:1;min-width:0;overflow-wrap:anywhere}


.sk-cat{margin:0 0 22px}
.sk-ch{display:flex;align-items:center;gap:10px;margin:0 0 4px;padding:0 0 8px;border-bottom:4px solid var(--c)}
.sk-ch h3{font-size:30px;font-weight:800;text-transform:uppercase;margin-right:auto}
.sk-ch .mono{font-size:15px;font-weight:700;color:var(--muted)}
.sk-sub{margin:14px 0 8px;font:700 15px/1 var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.sk-sub::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--c)}
.sk-tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,160px),1fr));gap:8px}
.sk-t{position:relative;display:flex;background:var(--panel);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:10px;min-height:88px;box-shadow:var(--shadow)}
.sk-t:hover{border-color:var(--muted);border-left-color:var(--c)}
.sk-a{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:space-between;gap:8px;padding:10px 40px 10px 10px;text-decoration:none}
.sk-a b{font:700 17px/1.1 var(--f-display);text-transform:uppercase;overflow-wrap:anywhere}
.sk-k{align-self:flex-start;font:700 10.5px/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;border-radius:5px;padding:4px 6px;color:#fff;background:var(--acc-text)}
.sk-k.k-p{background:var(--red)}
.sk-k.k-i{background:var(--blue)}
.sk-k.k-l{background:var(--muted)}
.sk-ck{position:absolute;right:6px;top:6px;width:28px;height:28px;border-radius:50%;border:2px solid var(--line);background:var(--panel-2);color:#fff;font:700 15px/1 var(--f-mono);display:grid;place-items:center;padding:0}
.sk-t.on .sk-ck{background:var(--acc-text);border-color:var(--acc-text)}
.sk-t.on{opacity:.62}
.sk-ed{position:absolute;right:6px;bottom:6px;width:28px;height:28px;border:0;background:none;color:var(--muted);font-size:15px;padding:0}

.vh{position:absolute;left:0;top:0;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
label.btn,label.lbtn,label.vlink{position:relative;overflow:hidden}

.cm{border-top:1px solid var(--line);margin-top:4px;padding-top:2px}
.cm summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:8px 0;font-weight:600;min-height:40px}
.cm summary::-webkit-details-marker{display:none}
.cm summary::after{content:"+";margin-left:auto;color:var(--muted);font:600 18px/1 var(--f-mono)}
.cm[open] summary::after{content:"–"}
.cm-n{background:var(--acc-text);color:var(--panel);border-radius:999px;padding:2px 8px;font-size:12px}
.cm-l{list-style:none;margin:0 0 8px;padding:0;display:flex;flex-direction:column;gap:8px}
.cm-i{background:var(--panel-2);border-radius:10px;padding:8px 12px}
.cm-i.mine{border-left:3px solid var(--acc-text)}
.cm-h{display:flex;align-items:center;gap:8px;font-size:13px}
.cm-h span{color:var(--muted);margin-right:auto}
.cm-x{border:0;background:none;color:var(--muted);width:28px;height:28px;padding:0;font-size:13px}
.cm-i p{margin-top:2px;white-space:pre-line;overflow-wrap:anywhere}
.cm-f{display:flex;gap:8px;align-items:flex-end;padding-bottom:6px}
.cm-f textarea{flex:1;min-width:0;background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-size:16px;line-height:1.4;resize:vertical}
/* Publish bar + toast */
.pubbar{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:45;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));pointer-events:none}
.pubbar .in{pointer-events:auto;max-width:640px;margin:0 auto 8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--club);color:var(--club-ink);border-radius:14px;padding:10px 10px 10px 14px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.pubbar p{flex:1 1 180px;font-size:13.5px}
.pubbar .btn{min-height:36px}
.pubbar .btn.go{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.pubbar .btn.ghost{color:var(--club-ink)}
@media (min-width:900px){.pubbar{bottom:16px}}
.toast{pointer-events:none;position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;max-width:calc(100vw - 32px);box-shadow:var(--shadow)}
@media (min-width:900px){.toast{bottom:24px}}
body.haspub{padding-bottom:calc(150px + env(safe-area-inset-bottom,0px))}
@media (min-width:900px){body.haspub{padding-bottom:110px}}

/* Logo, photos */
#crestBox{display:block;flex:none}
.logo{display:block;height:44px;width:auto;max-width:136px;object-fit:contain}
.crestbtn{position:relative;display:block;border:0;background:none;padding:0;color:inherit}
.crestbtn .edit{position:absolute;right:-7px;bottom:-5px;width:22px;height:22px;border-radius:50%;background:var(--panel);color:var(--fg);display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.crestbtn .edit svg{width:12px;height:12px}
.btn svg{width:18px;height:18px}
.hero .lbtn.go{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.ph{position:relative;padding:0!important;background:var(--panel-2)!important;overflow:visible}
.ph img{display:block;width:100%;height:100%;border-radius:50%;object-fit:cover}
.ph i{position:absolute;right:-6px;bottom:-5px;min-width:19px;height:19px;padding:0 4px;border-radius:10px;background:var(--att);color:var(--att-ink);border:1.5px solid var(--att-ring);font:700 10.5px/16px var(--f-mono);font-style:normal;text-align:center}
.pill .num.ph{width:44px;height:44px;border:2px solid var(--att)}
.bench .pill .num.ph{width:34px;height:34px}
.bignum.ph{width:60px;height:60px;border:2px solid var(--att-ring)}
.bignum.ph i{min-width:26px;height:26px;border-radius:13px;font-size:13.5px;line-height:23px;right:-7px;bottom:-6px}
.num.sm.ph{width:32px;height:32px}
.num.sm.ph i{min-width:17px;height:17px;font-size:9.5px;line-height:14px;right:-7px;bottom:-6px;padding:0 3px}
.phgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:16px 10px}
.phtile{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-width:0}
.phpick{position:relative;display:block;cursor:pointer}
.phpick input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.phpick:focus-within .phav{outline:2px solid var(--acc-text);outline-offset:2px}
.phav{position:relative;display:grid;place-items:center;width:78px;height:78px;border-radius:50%;background:var(--panel-2);border:2px dashed var(--line);overflow:hidden}
.phav:has(img){border-style:solid;border-color:var(--acc-text)}
.phav img{width:100%;height:100%;object-fit:cover}
.phav b{font:800 25px/1 var(--f-display);color:var(--muted)}
.phav i{position:absolute;left:0;right:0;bottom:0;padding:3px 0 6px;background:rgba(5,20,10,.66);color:#fff;font:600 10.5px/1 var(--f-body);font-style:normal}
.phn{font-size:13px;font-weight:600;line-height:1.25;overflow-wrap:anywhere}
.phn .mono{color:var(--muted);font-size:12px}
.phdel{border:0;background:none;color:var(--red);font-size:12.5px;font-weight:600;padding:2px 6px;min-height:28px}
.logoprev{display:grid;place-items:center;min-height:96px;border:1px dashed var(--line);border-radius:10px;padding:12px;background:repeating-conic-gradient(var(--panel-2) 0 25%,var(--panel) 0 50%) 0 0/16px 16px}
.logoprev img{max-height:120px;width:auto}
.colrow{display:flex;align-items:center;gap:12px}
.fld .colrow input[type=color]{width:64px;height:44px;padding:3px;flex:none;cursor:pointer}

/* Fiche match plein écran (pour capture) */
body.noscroll{overflow:hidden}
.fiche{position:fixed;inset:0;z-index:100;display:flex;justify-content:center;background:#050d08;overflow:hidden}
.f-card{position:relative;width:min(100vw,calc(100vh * .6));width:min(100vw,calc(100dvh * .6));height:100vh;height:100dvh;display:flex;flex-direction:column;gap:10px;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(12px + env(safe-area-inset-bottom,0px));color:#fff;background:linear-gradient(165deg,var(--club-2) 0%,var(--club) 48%,#04100a 100%);overflow:hidden}
.f-card::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,transparent 0 26px,rgba(255,255,255,.03) 26px 52px);pointer-events:none}
.f-card>*{position:relative}
.f-card>.wm{position:absolute;right:-14%;top:7%;width:64%;height:auto;opacity:.12;pointer-events:none}
.f-hd{display:flex;align-items:center;gap:11px}
.f-logo{display:block;height:44px;width:auto;max-width:132px;object-fit:contain;flex:none}
.f-hd .crest{width:38px;height:44px;font-size:14px}
.f-club{display:flex;flex-direction:column;gap:4px;margin-right:auto;min-width:0}
.f-club b{font:800 20px/1 var(--f-display);text-transform:uppercase;letter-spacing:.05em}
.f-club span{font:600 10.5px/1 var(--f-body);letter-spacing:.16em;text-transform:uppercase;color:var(--tint)}
.f-cd{font:700 13px/1 var(--f-mono);background:var(--acc);color:var(--acc-ink);border-radius:6px;padding:7px 9px;flex:none}
.f-team{display:inline-block;align-self:flex-start;font:800 13px/1 var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:var(--acc-ink);background:var(--acc);border-radius:4px;padding:5px 8px 4px;margin-top:4px}
.f-vs{font:800 clamp(30px,9.6vw,48px)/.92 var(--f-display);text-transform:uppercase;letter-spacing:.01em;overflow-wrap:break-word;margin:0}
.f-vs.md{font-size:clamp(26px,7.8vw,40px)}
.f-vs.lg{font-size:clamp(22px,6.6vw,34px)}
.f-vs span{color:var(--tint);font-size:.5em;font-weight:700;margin:0 .3em;vertical-align:.24em}
.f-facts{font-size:13px;line-height:1.4;color:rgba(255,255,255,.86)}
.f-facts b{color:#fff;font-weight:600}
.f-pitch{position:relative;flex:1 1 auto;min-height:220px;border-radius:14px;overflow:hidden;background:repeating-linear-gradient(180deg,var(--pitch) 0 12.5%,var(--pitch-2) 12.5% 25%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.16),0 10px 30px rgba(0,0,0,.35)}
.f-pitch::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent calc(7% - 1px),rgba(255,255,255,.6) 7%,transparent calc(7% + 1px)),linear-gradient(90deg,transparent calc(93% - 1px),rgba(255,255,255,.6) 93%,transparent calc(93% + 1px));opacity:.55}
.f-ruck{position:absolute;left:4%;top:3%;font:600 11px var(--f-body);color:rgba(255,255,255,.85);border:1px dashed rgba(255,255,255,.75);border-radius:6px;padding:2px 8px}
.f-p{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:4px;width:96px}
.f-p .num{width:clamp(32px,5vh,42px);height:clamp(32px,5vh,42px);font-size:15px;border:2px solid var(--att-ring);box-shadow:0 3px 10px rgba(0,0,0,.4)}
.f-p .num.ph{width:clamp(38px,6.3vh,56px);height:clamp(38px,6.3vh,56px);border-color:var(--att)}
.f-p .num.ph i{min-width:22px;height:22px;font-size:12px;line-height:19px;border-radius:11px}
.f-nm{font:700 clamp(11px,1.55vh,12.5px)/1.15 var(--f-body);color:#fff;background:rgba(4,16,9,.78);border-radius:6px;padding:3px 7px;text-align:center;max-width:100%;overflow-wrap:anywhere}
.f-p.empty .num{background:transparent;color:#fff;border:2px dashed rgba(255,255,255,.7);box-shadow:none}
.f-row{display:flex;flex-wrap:wrap;align-items:center;gap:7px}
.f-lab{width:100%;font:700 10.5px/1 var(--f-body);letter-spacing:.16em;text-transform:uppercase;color:var(--tint)}
.f-p.b{position:static;transform:none;flex-direction:row;width:auto;gap:7px;background:rgba(255,255,255,.09);border-radius:999px;padding:3px 11px 3px 3px}
.f-p.b .num{width:28px;height:28px;font-size:12px;box-shadow:none}
.f-p.b .num.ph{width:30px;height:30px}
.f-p.b .num.ph i{min-width:16px;height:16px;font-size:9.5px;line-height:13px;right:-6px;bottom:-5px}
.f-p.b .f-nm{background:none;padding:0;font-size:12.5px}
.f-lanc ol{list-style:none;margin:0;padding:0;width:100%;display:grid;grid-template-columns:1fr 1fr;gap:7px 12px}
.f-lanc li{display:grid;grid-template-columns:24px minmax(0,1fr);column-gap:8px;align-items:center;min-width:0}
.f-lanc li b{grid-row:span 2;display:grid;place-items:center;width:24px;height:24px;border-radius:6px;background:var(--acc);color:var(--acc-ink);font:800 14px/1 var(--f-display)}
.f-lanc li span{font:700 16px/1.05 var(--f-display);text-transform:uppercase;letter-spacing:.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.f-lanc li small{font-size:11px;line-height:1.2;color:rgba(255,255,255,.7);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.f-ft{display:flex;align-items:center;gap:10px;font:600 10.5px/1 var(--f-body);letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.7)}
.f-ft::before,.f-ft::after{content:"";flex:1;height:1px;background:rgba(255,255,255,.22)}
.f-ctl{position:absolute;z-index:3;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);width:min(calc(100vw - 20px),440px);display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px;border-radius:14px;background:rgba(0,0,0,.78);box-shadow:0 10px 30px rgba(0,0,0,.4);transition:opacity .45s}
.fiche.clean .f-ctl{opacity:0;pointer-events:none}
.f-seg{display:flex;gap:4px;flex:1;min-width:0}
.f-seg button{flex:1;border:0;border-radius:9px;padding:8px;min-height:40px;background:rgba(255,255,255,.1);color:#fff;font:700 15px/1 var(--f-display);text-transform:uppercase;letter-spacing:.04em}
.f-seg button[aria-pressed="true"]{background:var(--acc);color:var(--acc-ink)}
.f-x{flex:none;width:40px;height:40px;border:0;border-radius:9px;background:rgba(255,255,255,.14);color:#fff;font-size:17px}
.f-tip{width:100%;text-align:center;font-size:12px;color:rgba(255,255,255,.78)}
@media (prefers-reduced-motion:reduce){.f-ctl{transition:none}}

/* Maillot blanc du club sur le terrain (compo et fiche match) */
.jsy{position:relative;display:block;width:44px;aspect-ratio:192/240;container-type:inline-size;flex:none}
.jsy img{display:block;width:100%;height:100%;object-fit:contain;pointer-events:none}
.jsy b{position:absolute;left:0;right:0;top:35%;text-align:center;font:800 30cqw/1 var(--f-display);color:#0e5c30;letter-spacing:-.02em}
.jsy.green b{color:#fff}
.pill .jsy,.f-p .jsy{filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}
.f-p .jsy{width:clamp(40px,6.2vh,54px)}
.pill.me .jsy img{filter:drop-shadow(0 0 1.5px var(--ink-run)) drop-shadow(0 0 1.5px var(--ink-run))}
.pill.empty .jsy,.f-p.empty .jsy{filter:none}
.pill.empty .jsy img,.f-p.empty .jsy img{opacity:.22}
.pill.empty .jsy b,.f-p.empty .jsy b{color:#fff}
.bench .pill .jsy{width:32px;height:30px;filter:none}
.bench .pill.empty .jsy .jb{stroke:var(--muted)}
.bench .pill.empty .jsy text{fill:var(--muted)}
.f-p.b .jsy{width:28px;filter:none}

/* Effectif */
.pgrid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr))}
.pcard{display:flex;align-items:center;gap:12px;text-align:left;padding:10px 12px;min-height:66px;color:inherit}
.pcard:hover{border-color:var(--muted)}
.pcard.me{outline:2px solid var(--acc-text)}
.pcard.out{opacity:.6}
.pcard>.num{width:44px;height:44px;font-size:15px}
.pcard>.num.ph{width:48px;height:48px}
.pc-b{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.pc-b b{font-weight:600;font-size:15px;overflow-wrap:anywhere}
.pc-b small{font-size:12.5px;color:var(--muted)}

    title: 'Qui es-tu ?',
    body: `<p class="hint">Ton choix reste sur ce téléphone. Il sert à afficher ton poste, ton instruction et les clips pour toi.</p>
      <div class="pick">${sortedPlayers().map(p => `<button type="button" class="pickbtn${p.id === me ? ' on' : ''}" data-act="set-me" data-id="${p.id}">${numAv(p, p.n || '', 'num sm')}${esc(p.name)}</button>`).join('')}</div>
      <button type="button" class="btn ghost" data-act="set-me" data-id="">Je ne suis pas joueur (staff, invité)</button>`
  });
}
async function compressImage(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = new Image(); await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = url; });
    const s = Math.min(1, 1400 / Math.max(img.width, img.height)); const c = document.createElement('canvas');
    c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
    const g = c.getContext('2d'); g.fillStyle = '#ffffff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
    return c.toDataURL('image/jpeg', .78);
  } finally { URL.revokeObjectURL(url); }
}

let KIT_LOCAL = '';
const kitNow = () => (FICHE && FICHE.kit) || KIT_LOCAL || (S.club && S.club.kit) || 'white';
function jersey(n) { const k = kitNow() === 'green' ? 'green' : 'white'; return `<span class="jsy ${k}" aria-hidden="true"><img src="${KIT_IMG[k]}" alt=""><b>${esc(n)}</b></span>`; }
function kitSeg() { const k = kitNow(); return `<div class="f-seg" role="group" aria-label="Maillot">${[['white', 'Maillot blanc'], ['green', 'Maillot vert']].map(([v, l]) => `<button type="button" data-act="kit" data-v="${v}" aria-pressed="${k === v}">${l}</button>`).join('')}</div>`; }
/* Sur le terrain (compo, fiche match) : la photo du joueur si elle existe, sinon le maillot blanc du club avec son numéro. */

const THEME_KEYS = ['--club', '--club-2', '--club-text', '--club-text-dk', '--club-tint'];

  const st = document.documentElement.style, c = S.club && S.club.color;

  if (!c || !/^#[0-9a-f]{6}$/i.test(c)) { THEME_KEYS.forEach(k => st.removeProperty(k)); return; }

  if (el.id === 'capIn') { const st = curStep(); if (st) { st.cap = el.value; markDirty(); } }
  else if (el.id === 'txtIn') B.txt = el.value;
  else if (el.id === 'tkLabel') {
    const b = curBoard(); if (!b || !B.sel) return;
    for (const st of b.steps) for (const tk of st.tokens) if (tk.id === B.sel) tk.l = el.value.trim();
    markDirty(); const st = curStep(); $('#lyrT').innerHTML = tokensSVG(st, B.sel);
  }
});
document.addEventListener('submit', e => {
  if (e.target.id !== 'sheetForm') return;
  e.preventDefault();
  const o = SHEET; if (!o?.save) return;
  if (o.save(new FormData(e.target), e.target) === false) return;
  closeSheet(); markDirty(); render();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && FICHE) { closeFiche(); return; }
  if (e.key === 'Escape' && $('#sheet')?.open) return;
  if (e.target.closest('input,textarea,select') || $('#sheet')?.open) return;
  if (curBoard()?.kind === 'anim' && $('#acv')) {
    if (e.code === 'Space') { e.preventDefault(); aPlayToggle(); }
    else if (B.editing && (e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); aUndo(); }
    return;
  }
  if (!B.editing) return;
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); undo(); }
  else if ((e.key === 'Delete' || e.key === 'Backspace') && B.sel) { e.preventDefault(); const st = curStep(); pushHist(); st.tokens = st.tokens.filter(x => x.id !== B.sel); B.sel = null; boardChanged(); }
});

/* Version autonome (VS Code, hébergement perso) : page.html?coach active le mode coach ; « Publier » télécharge le nouvel index.html. */
function localCoach() {
  canEdit = true;
  art = { local: true, publish: async () => {
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(S, null, 1)], { type: 'application/json' })); a.download = 'contenu.json';
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  } };
  const pb = document.querySelector('#pubbar [data-act="publish"]'); if (pb) pb.textContent = 'Enregistrer contenu.json';
  const d = store.get('draft', null);
  if (d && d.s && JSON.stringify(d.s) !== BASE) draftOffer = Object.assign(d, { stale: d.base !== hash(BASE) });
  else if (d) store.del('draft');
  render();
}

/* ---------- Application (hors claude.ai) : contenu dans data/contenu.json + mise à jour ---------- */
const STANDALONE = !(window.claude && typeof window.claude.use === 'function') && /^https?:$/.test(location.protocol);
async function loadContenu() {
  if (!STANDALONE) return;
  try {
    const r = await fetch('data/contenu.json', { cache: 'no-store' });
    if (!r.ok) return;
    const j = await r.json(); if (!j || typeof j !== 'object') return;
    if (dirty) return;
    S = j; normalize(S); BASE = JSON.stringify(S); compoMatch = S.current; render();
  } catch {}
}
function swUpdateBar(w) {
  if (document.getElementById('updbar')) return;
  const t = document.createElement('div'); t.id = 'updbar'; t.className = 'banner';
  t.style.cssText = 'position:fixed;left:12px;right:12px;top:calc(10px + env(safe-area-inset-top,0px));z-index:90;max-width:520px;margin:0 auto;background:var(--panel);box-shadow:var(--shadow)';
  t.innerHTML = '<p><b>Nouvelle version disponible.</b></p><button class="btn primary sm" type="button">Mettre à jour</button>';
  t.querySelector('button').onclick = () => { try { w.postMessage('skip'); } catch {} setTimeout(() => location.reload(), 600); };
  document.body.appendChild(t);
}
if (STANDALONE && 'serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').then(reg => {
    if (reg.waiting && navigator.serviceWorker.controller) swUpdateBar(reg.waiting);
    reg.addEventListener('updatefound', () => { const w = reg.installing; if (w) w.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) swUpdateBar(w); }); });
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { reg.update().catch(() => {}); loadContenu(); } });
  }).catch(() => {});
  let reloading = false; navigator.serviceWorker.addEventListener('controllerchange', () => { if (!reloading) { reloading = true; location.reload(); } });
}

// Secours lecture vidéo (iPhone/Safari) : si une vidéo ne démarre pas, on la télécharge puis on la lit depuis la mémoire du téléphone.
(() => {
  const tried = new WeakSet();
  document.addEventListener('error', async ev => {
    const v = ev.target;
    if (!v || v.tagName !== 'VIDEO' || tried.has(v)) return;
    const src = v.getAttribute('src');
    if (!src || /^(blob|data):/i.test(src)) return;
    tried.add(v);
    try {
      const r = await fetch(src);
      if (!r.ok) return;
      let b = await r.blob();
      if (!b.type || b.type.indexOf('video/') !== 0) b = new Blob([b], { type: 'video/mp4' });
      v.src = URL.createObjectURL(b);
      v.load();
    } catch (e) {}
  }, true);
})();
